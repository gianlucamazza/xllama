name: Report inappropriate generated content
description: Store policy 11.16 — report text or images generated by xllama
title: "[store-report] "
labels: ["store-report"]
body:
  - type: markdown
    attributes:
      value: >
        Use this form for **inappropriate generated text or images**. Do not
        paste illegal content (including sexual content involving minors).
        Describe the category and the catalogue model.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Sexual / pornographic
        - Violence / gore
        - Hate / harassment
        - Self-harm
        - Other (describe)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Catalogue model id
      placeholder: lfm25-350m, sd-turbo-fp16, …
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Short description. Do not attach illegal material.
    validations:
      required: true
