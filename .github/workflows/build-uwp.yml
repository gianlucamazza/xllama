name: build-uwp

on:
  push:
  pull_request:

jobs:
  build:
    # Pin to windows-2022: has VS2022 (v143) + UWP workload pre-installed.
    # windows-latest is transitioning to windows-2025-vs2026 which lacks UWP.
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          # Shallow submodule fetch: llama.cpp history is ~1.5 GB, depth=1 is ~40s
          fetch-depth: 1

      - name: Apply UWP patches to llama.cpp submodule
        shell: bash
        run: bash scripts/apply-uwp-patches.sh

      - name: Build UWP package
        shell: pwsh
        run: ./scripts/build-uwp.ps1 -Configuration Release -Platform x64

      - uses: actions/upload-artifact@v4.4.3
        if: success()
        with:
          name: xllama-appx
          # Include .msix (main package), .appx (VCLibs deps), and .cer
          # (public key of the test certificate that must be trusted on the
          # Xbox before deploying — installed via Device Portal API).
          path: |
            uwp/AppPackages/**/*.msix
            uwp/AppPackages/**/*.appx
            uwp/xllama-test.cer
          retention-days: 14
