name: build-uwp

on:
  push:
    branches: [main]
  pull_request:
  # Store SKU is opt-in: avoids +~13 min on every PR. From Linux (no Windows VM):
  #   gh workflow run build-uwp.yml -f store_sku=true --ref <branch>
  # Artifact: xllama-appx-store. SSOT: docs/release-readiness.md
  workflow_dispatch:
    inputs:
      store_sku:
        description: "Also build Store SKU (XLLAMA_STORE_SKU, artifact xllama-appx-store)"
        type: boolean
        default: false

# Superseded runs for the same PR cancel. Pushes and manual runs use distinct
# groups so that a pending main run can still build and attest its MSIX.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Pin to windows-2022: has VS2022 (v143) + UWP workload pre-installed.
    # windows-latest is transitioning to windows-2025-vs2026 which lacks UWP.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shipping package: unified backends + PatchedGenAI #2280 + PatchedOrt
          # (AppContainer external-data). ORT DLL is a cached release asset
          # (vendor-dlls-v1) — full ORT rebuild is 1–3 h (see build-uwp-ort-patched).
          - variant: unified
            patched: true
            artifact: xllama-appx
          # Bench-only lane: llama.cpp CPU A/B (not for pad chat shipping).
          - variant: llamacpp
            patched: false
            artifact: xllama-appx-llamacpp
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - uses: ./.github/actions/build-uwp-package
        with:
          variant: ${{ matrix.variant }}
          patched: ${{ matrix.patched }}
          store_sku: "false"
          artifact: ${{ matrix.artifact }}
          build_revision: ${{ github.run_number }}

  # Store SKU: separate job so the gate can use inputs.* (matrix.* is illegal
  # in job-level if). Only on workflow_dispatch with store_sku=true.
  store:
    if: github.event_name == 'workflow_dispatch' && inputs.store_sku == true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Sign bundled model catalogue
        shell: bash
        env:
          XLLAMA_CATALOGUE_PRIVATE_KEY: ${{ secrets.XLLAMA_CATALOGUE_PRIVATE_KEY }}
          XLLAMA_CATALOGUE_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${XLLAMA_CATALOGUE_PRIVATE_KEY}" ]; then
            echo "XLLAMA_CATALOGUE_PRIVATE_KEY is required for the Store SKU" >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/xllama-catalogue-private-key.pem"
          signed_file="${RUNNER_TEMP}/xllama-model-manifest.signed.json"
          trap 'rm -f "${key_file}" "${signed_file}"' EXIT
          printf '%s\n' "${XLLAMA_CATALOGUE_PRIVATE_KEY}" > "${key_file}"
          python -m pip install --disable-pip-version-check --no-warn-script-location cryptography
          python scripts/sign-model-manifest.py sign \
            uwp/models/manifest.json "${signed_file}" \
            --private-key "${key_file}" \
            --catalogue-version "${XLLAMA_CATALOGUE_VERSION}" \
            --key-id release-v1
          mv "${signed_file}" uwp/models/manifest.json

      - uses: ./.github/actions/build-uwp-package
        with:
          variant: unified
          patched: "true"
          store_sku: "true"
          artifact: xllama-appx-store
          build_revision: ${{ github.run_number }}

  attest-unified:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'gianlucamazza/xllama'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xllama-appx
          path: unified
      - name: Check shipping MSIX
        id: package
        shell: bash
        run: |
          shopt -s globstar nullglob
          packages=(unified/**/*.msix)
          if [[ ${#packages[@]} != 1 || ! -f "${packages[0]}" ]]; then
            echo "::error::Expected exactly one MSIX in the unified build artifact."
            exit 1
          fi
          echo "msix=${packages[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "unified/**/*.msix"
          create-storage-record: "false"
      - name: Check inventory subject against the signed package
        shell: bash
        env:
          MSIX: ${{ steps.package.outputs.msix }}
        run: |
          digest=$(sha256sum "$MSIX" | cut -d ' ' -f1)
          jq -e --arg digest "$digest" '
            [.packages[] | select(.SPDXID == "SPDXRef-MSIX") | .checksums[]
              | select(.algorithm == "SHA256") | .checksumValue] == [$digest]
          ' "${MSIX}.spdx.json"
      - name: Attest the package inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.package.outputs.msix }}"
          sbom-path: "${{ steps.package.outputs.msix }}.spdx.json"
          create-storage-record: "false"
