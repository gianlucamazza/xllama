name: build-uwp

on:
  push:
  pull_request:

jobs:
  build:
    # Pin to windows-2022: has VS2022 (v143) + UWP workload pre-installed.
    # windows-latest is transitioning to windows-2025-vs2026 which lacks UWP.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          # llama.cpp submodule not needed for UWP ORT build; skip to save ~40s
          submodules: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache SmolLM2-360M ONNX INT4 model
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/smollm2-360m-cpu-int4
          key: smollm2-360m-ort-genai-int4-cpu-v1

      - name: Build SmolLM2-360M INT4 CPU model
        if: steps.cache-model.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --quiet `
            --extra-index-url https://download.pytorch.org/whl/cpu `
            onnxruntime-genai onnx onnx-ir transformers torch
          python -m onnxruntime_genai.models.builder `
            -m HuggingFaceTB/SmolLM2-360M-Instruct `
            -o models/smollm2-360m-cpu-int4 `
            -p int4 -e cpu

      - name: Restore NuGet packages
        shell: pwsh
        working-directory: uwp
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Build UWP package
        shell: pwsh
        run: ./scripts/build-uwp.ps1 -Configuration Release -Platform x64

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: xllama-appx
          # Include .msix (main package), .appx (VCLibs deps), and .cer
          # (public key of the test certificate that must be trusted on the
          # Xbox before deploying — installed via Device Portal API).
          path: |
            uwp/AppPackages/**/*.msix
            uwp/AppPackages/**/*.appx
            uwp/xllama-test.cer
          retention-days: 14
