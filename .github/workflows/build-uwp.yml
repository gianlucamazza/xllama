name: build-uwp

on:
  push:
    branches: [main]
  pull_request:

# Feature branches build once via pull_request (not also via push); superseded
# runs on the same branch cancel — UWP builds are ~13 min, so this saves the most.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pin to windows-2022: has VS2022 (v143) + UWP workload pre-installed.
    # windows-latest is transitioning to windows-2025-vs2026 which lacks UWP.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shipping package: unified backends + patched GenAI #2280 (routing GPU in XAML).
          - variant: unified
            patched: true
            artifact: xllama-appx
          # Bench-only lane: llama.cpp CPU A/B (not for pad chat shipping).
          - variant: llamacpp
            patched: false
            artifact: xllama-appx-llamacpp
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Checkout llama.cpp submodule + apply AppContainer guards
        if: matrix.variant == 'llamacpp' || matrix.variant == 'unified'
        shell: bash
        run: |
          git submodule update --init --depth 1 llama.cpp
          bash scripts/apply-uwp-patches.sh

      - name: Restore NuGet packages
        shell: pwsh
        working-directory: uwp
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Build patched onnxruntime-genai.dll (#2280) from source
        if: matrix.patched
        shell: pwsh
        run: ./scripts/vendor-genai-dml-patch.ps1 -Build

      - name: Verify the patched DLL replaced the NuGet copy
        if: matrix.patched
        shell: pwsh
        run: |
          $genai = ([xml](Get-Content uwp/packages.config)).packages.package |
            Where-Object { $_.id -eq "Microsoft.ML.OnnxRuntimeGenAI.DirectML" } |
            Select-Object -ExpandProperty version
          $vendor = "vendor/onnxruntime-genai-patched/win-x64/onnxruntime-genai.dll"
          $nuget = "uwp/packages/Microsoft.ML.OnnxRuntimeGenAI.DirectML.$genai/runtimes/win-x64/native/onnxruntime-genai.dll"
          if (-not (Test-Path $vendor)) { Write-Error "patched DLL missing: $vendor"; exit 1 }
          if ((Get-FileHash $vendor).Hash -ne (Get-FileHash $nuget).Hash) {
            Write-Error "NuGet DLL is not the patched build"
            exit 1
          }

      - name: Build UWP package
        shell: pwsh
        run: |
          # Hashtable splatting — string arrays bind positionally and break -Backend.
          $buildArgs = @{
            Configuration = 'Release'
            Platform      = 'x64'
            Backend       = $('${{ matrix.variant }}' -eq 'unified' ? 'unified' : '${{ matrix.variant }}')
            # Unique, monotonic MSIX Revision per build (Major.Minor.Build stays
            # the committed semantic version) so console updates never collide.
            BuildRevision = ${{ github.run_number }}
          }
          if ('${{ matrix.patched }}' -eq 'true') { $buildArgs.PatchedGenAI = $true }
          ./scripts/build-uwp.ps1 @buildArgs

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ matrix.artifact }}
          path: |
            uwp/AppPackages/**/*.msix
            uwp/AppPackages/**/*.appx
            uwp/xllama-test.cer
          retention-days: 14