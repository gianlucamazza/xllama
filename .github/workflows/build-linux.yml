name: build-linux

on:
  push:
    branches: [main]
  pull_request:

# Feature branches build once via pull_request (not also via push); superseded
# runs on the same branch cancel so only the latest commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev ccache \
            python3-pip shellcheck
          # Pinned: an unpinned clang-format broke CI when 22.x changed rules
          # (2026-07-10). Bump deliberately and reformat the tree in one PR.
          pip3 install --user 'clang-format==22.1.5'
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Verify C++ formatting
        run: |
          find . \
            -path ./llama.cpp -prune -o \
            -path ./build -prune -o \
            -path ./build-uwp-test -prune -o \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) -type f -print |
            xargs clang-format --dry-run --Werror

      - name: Verify shell script quality
        run: |
          shellcheck scripts/*.sh

      - name: Smoke test debug tooling (profile analyzer + GPU sampler parser)
        run: |
          python3 scripts/analyze_ort_profile.py tests/fixtures/ort_profile_sample.json |
            grep -q "VERDICT: MIXED"
          python3 scripts/analyze_ort_profile.py tests/fixtures/ort_profile_truncated.json |
            grep -q "VERDICT:"
          ./scripts/xbox-gpu-sample.sh --parse-stdin < tests/fixtures/systemperf_sample.json |
            grep -q "^[0-9]*,42,404,0.720"

      - name: Verify generated benchmark summaries
        run: python3 scripts/generate-benchmark-summary.py --check

      - name: Verify code/project/doc coherence (SSOT audit)
        run: python3 scripts/check-coherence.py

      - name: Configure (with tests)
        run: cmake --preset linux-test

      - name: Build
        run: cmake --build build/linux-test -j$(nproc)

      - name: Run unit tests
        run: ctest --test-dir build/linux-test --output-on-failure

      # docs/launch-copy.md publishes the suite size as a citable fact, and it
      # had drifted 16 cases behind before anyone noticed. It cannot live in
      # check-coherence.py, which is offline and static: `grep -c TEST_CASE`
      # returns 199 against the binary's 192 because seven cases sit behind #if,
      # so a static count would be confidently wrong. Here the suite has just
      # been built, so the real numbers are one command away.
      - name: Verify the published test-suite size
        run: |
          out=$(./build/linux-test/tests/xllama-tests | tail -3)
          cases=$(sed -n 's/.*test cases: *\([0-9]*\) .*/\1/p' <<<"$out")
          asserts=$(sed -n 's/.*assertions: *\([0-9]*\) .*/\1/p' <<<"$out")
          [ -n "$cases" ] && [ -n "$asserts" ] || {
            echo "could not parse doctest output:"; echo "$out"; exit 1; }
          claim="**${cases} host test cases / ${asserts} assertions**"
          grep -qF "$claim" docs/launch-copy.md || {
            echo "docs/launch-copy.md does not claim '${claim}'."
            echo "The suite reports ${cases} cases / ${asserts} assertions — update the"
            echo "Scale bullet in docs/launch-copy.md to match."
            grep -n 'host test cases' docs/launch-copy.md || true
            exit 1; }
          echo "launch-copy.md matches the suite: ${cases} cases / ${asserts} assertions"

      - name: Smoke test
        run: ./build/linux-test/bin/xllama-cli --help

      - name: Verify UWP gate
        run: |
          output=$(cmake -B build-uwp-test -DXLLAMA_TARGET=uwp 2>&1 || true)
          if echo "$output" | grep -qi "build-uwp.ps1"; then
            echo "UWP gate OK"
          else
            echo "UWP gate missing"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: xllama-cli-linux
          path: build/linux-test/bin/xllama-cli
          retention-days: 14
