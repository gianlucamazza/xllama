name: release-research

on:
  push:
    tags: ['research-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing research tag at the selected workflow ref
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify release source
        run: |
          expected="research-v$(python3 -c 'import tomllib; print(tomllib.load(open("release.toml","rb"))["release"]["version"])')"
          test "$RELEASE_TAG" = "$expected"
          tag_commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          event_commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          if [[ "$tag_commit" != "$event_commit" || "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Select the release tag as the workflow ref so the tested source matches the attestation."
            exit 1
          fi

      - name: Validate release metadata and research evidence
        run: |
          python3 scripts/generate-benchmark-summary.py --check
          python3 scripts/build-research-package.py --check
          python3 scripts/check-release-metadata.py --require-doi
          python3 -m unittest tests/test_research_package.py tests/test_xab_contract.py tests/test_release_metadata.py tests/test_release_bundle.py

      - name: Build tagged research bundle
        run: python3 scripts/build-release-bundle.py --ref "$GITHUB_SHA"

      - name: Attest release bundle
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-bundle/*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "xLlama Research Report $RELEASE_TAG" \
            --notes-file paper/release.md \
            release-bundle/*
