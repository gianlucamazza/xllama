version: 2
updates:
  # GitHub Actions used by the CI workflows (checkout, upload-artifact, …).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Vendored llama.cpp submodule — surface upstream bumps as PRs (arch/quant
  # support, security). Review carefully: a bump can shift GGUF loader behaviour.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # Pinned at d812350 by owner decision 2026-10-24; bump only with explicit owner approval (see #349, #356).
    ignore:
      - dependency-name: llama.cpp
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']

  # Host-only SD-Turbo export toolchain. Version PRs are off: the set moves
  # as one coherent bump re-checked with compare_onnx_exports.py (ADR 0003).
  # Security updates are not ignored now that optimum-onnx is gone (#263).
  - package-ecosystem: pip
    directory: /diffusion
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps
